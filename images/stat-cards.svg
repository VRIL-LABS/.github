<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.grid{
  display:flex;gap:0;width:800px;height:110px;
  font-family:ui-monospace,'SF Mono','Fira Mono',Consolas,monospace;
  background:#0b0c0b;
}
.card{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  border-right:1px solid #151d1a;
  padding:16px 8px;
  position:relative;overflow:hidden;
}
.card:last-child{border-right:none;}
/* top accent line that grows in */
.card::before{
  content:'';
  position:absolute;top:0;left:0;height:1px;
  background:#1fe8a8;width:0;
  animation:growline 0.6s ease-out forwards;
}
.card:nth-child(1)::before{animation-delay:0.2s}
.card:nth-child(2)::before{animation-delay:0.5s}
.card:nth-child(3)::before{animation-delay:0.8s}
.card:nth-child(4)::before{animation-delay:1.1s}
@keyframes growline{to{width:100%}}
.val{
  font-size:26px;font-weight:700;letter-spacing:-0.02em;
  color:#1fe8a8;line-height:1;
  opacity:0;
  animation:fadeup 0.5s ease-out forwards;
}
.card:nth-child(1) .val{animation-delay:0.4s}
.card:nth-child(2) .val{animation-delay:0.7s}
.card:nth-child(3) .val{animation-delay:1.0s}
.card:nth-child(4) .val{animation-delay:1.3s}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.lbl{
  font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
  color:#2e4a3e;margin-top:6px;text-align:center;line-height:1.4;
  opacity:0;
  animation:fadeup 0.5s ease-out 0.2s forwards;
}
.card:nth-child(1) .lbl{animation-delay:0.6s}
.card:nth-child(2) .lbl{animation-delay:0.9s}
.card:nth-child(3) .lbl{animation-delay:1.2s}
.card:nth-child(4) .lbl{animation-delay:1.5s}
</style>
<div class="grid">
  <div class="card">
    <div class="val">384</div>
    <div class="lbl">Bit Quantum<br/>Security</div>
  </div>
  <div class="card">
    <div class="val">2.4ms</div>
    <div class="lbl">KeyGen<br/>Latency</div>
  </div>
  <div class="card">
    <div class="val">6–7×</div>
    <div class="lbl">AVX2<br/>Speedup</div>
  </div>
  <div class="card">
    <div class="val">2⁻¹²⁸</div>
    <div class="lbl">CVKDF One-Way<br/>Bound</div>
  </div>
</div>
</div>
</foreignObject>
</svg>
