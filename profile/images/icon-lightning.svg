<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<defs>
  <filter id="lx-glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lx-halo" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- bolt shape: classic VRIL downward-left strike -->
  <!-- top segment: 24,4 -> 14,22 -> 20,22 -->
  <!-- bottom segment: 20,22 -> 10,44 -->
</defs>

<!-- halo / aura — expands on strike -->
<ellipse cx="24" cy="30" rx="10" ry="12" fill="#1fe8a8" opacity="0">
  <animate attributeName="opacity"
    values="0;0;0;0.18;0.08;0;0"
    keyTimes="0;0.35;0.42;0.48;0.58;0.68;1"
    dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="rx"
    values="6;6;6;14;18;6;6"
    keyTimes="0;0.35;0.42;0.48;0.58;0.68;1"
    dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="ry"
    values="8;8;8;18;22;8;8"
    keyTimes="0;0.35;0.42;0.48;0.58;0.68;1"
    dur="2.4s" repeatCount="indefinite"/>
</ellipse>

<!-- bolt body — main strike -->
<path d="M26 3 L13 25 L21 25 L22 25 L9 45 L32 21 L23 21 Z"
  fill="#1fe8a8"
  filter="url(#lx-glow)">
  <!-- charge flicker: rapid opacity flutter, then full strike, then decay -->
  <animate attributeName="opacity"
    values="0;0;0.15;0;0.25;0;1;1;0.7;1;0.4;0;0"
    keyTimes="0;0.2;0.25;0.28;0.32;0.35;0.42;0.5;0.55;0.6;0.68;0.72;1"
    dur="2.4s" repeatCount="indefinite"/>
  <animate attributeName="fill"
    values="#1fe8a8;#1fe8a8;#ffffff;#1fe8a8;#ffffff;#1fe8a8;#ffffff;#1fe8a8;#1fe8a8;#d0fff4;#1fe8a8;#1fe8a8;#1fe8a8"
    keyTimes="0;0.2;0.25;0.28;0.32;0.35;0.42;0.46;0.5;0.55;0.6;0.68;1"
    dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- stroke overlay for crisp edge -->
<path d="M26 3 L13 25 L21 25 L22 25 L9 45 L32 21 L23 21 Z"
  fill="none" stroke="#1fe8a8" stroke-width="0.5" stroke-opacity="0.4"
  filter="url(#lx-halo)">
  <animate attributeName="stroke-opacity"
    values="0;0;0;0.6;0.3;0;0"
    keyTimes="0;0.35;0.42;0.48;0.58;0.72;1"
    dur="2.4s" repeatCount="indefinite"/>
</path>
</svg>
