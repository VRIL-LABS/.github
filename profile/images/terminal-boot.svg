<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.terminal{
  width:800px;height:260px;
  background:#0b0c0b;
  border:1px solid #1a2a24;
  border-radius:6px;
  padding:20px 24px;
  font-family:ui-monospace,'SF Mono','Fira Mono',Consolas,monospace;
  overflow:hidden;
  position:relative;
}
/* scanline overlay */
.terminal::after{
  content:'';
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.035) 2px,rgba(0,0,0,0.035) 4px);
  pointer-events:none;
  border-radius:6px;
}
.line{
  font-size:12px;
  line-height:1.7;
  white-space:pre;
  overflow:hidden;
  max-height:0;
  opacity:0;
}
.prompt{color:#1fe8a8;}
.cmd{color:#c8ccca;}
.out{color:#4a7060;}
.val{color:#1fe8a8;}
.dim{color:#2e3e38;}
.warn{color:#0ab87f;}
/* cursor blink */
.cursor{
  display:inline-block;
  width:7px;height:13px;
  background:#1fe8a8;
  vertical-align:middle;
  margin-left:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* line reveals — staggered */
.l1{animation:reveal 0.1s 0.3s forwards}
.l2{animation:reveal 0.1s 1.1s forwards}
.l3{animation:reveal 0.1s 1.4s forwards}
.l4{animation:reveal 0.1s 2.0s forwards}
.l5{animation:reveal 0.1s 2.4s forwards}
.l6{animation:reveal 0.1s 3.0s forwards}
.l7{animation:reveal 0.1s 3.5s forwards}
.l8{animation:reveal 0.1s 4.2s forwards}
.l9{animation:reveal 0.1s 4.9s forwards}
.l10{animation:reveal 0.1s 5.6s forwards}
.l11{animation:reveal 0.1s 6.3s forwards}
@keyframes reveal{to{max-height:28px;opacity:1}}
</style>
<div class="terminal">
  <div class="line l1"><span class="dim">────────────────────────────────────────────────────────────────</span></div>
  <div class="line l2"><span class="prompt">vril@labs</span><span class="dim">:</span><span class="warn">~</span><span class="dim">$ </span><span class="cmd">vril-kem --init --security 384</span></div>
  <div class="line l3"><span class="out">  ✦  Initialising VRIL-KEM v1.0 · Module-LWE · n=<span class="val">4096</span> k=<span class="val">7</span> q=<span class="val">12289</span></span></div>
  <div class="line l4"><span class="out">  ✦  Loading CVKDF cascade   [<span class="val">████████████████████</span>] layers: <span class="val">7/7</span></span></div>
  <div class="line l5"><span class="out">  ✦  HI-Gaussian sampler     σ=<span class="val">3.19</span>  φ-weighted  bound: <span class="val">2⁻¹²⁸</span></span></div>
  <div class="line l6"><span class="out">  ✦  AVX2 NTT butterflies    16-way SIMD  speedup: <span class="val">6.8×</span></span></div>
  <div class="line l7"><span class="out">  ✦  EasyCrypt IND-CCA2      <span class="val">PROOF OK</span>  Jasmin constant-time: <span class="val">PASS</span></span></div>
  <div class="line l8"><span class="out">  ✦  Keygen latency          <span class="val">2.4ms</span>  Encap: <span class="val">2.1ms</span>  Decap: <span class="val">2.3ms</span></span></div>
  <div class="line l9"><span class="dim">────────────────────────────────────────────────────────────────</span></div>
  <div class="line l10"><span class="prompt">vril@labs</span><span class="dim">:</span><span class="warn">~</span><span class="dim">$ </span><span class="cmd">status</span></div>
  <div class="line l11"><span class="out">  ✦  System: </span><span class="val">SOVEREIGN</span><span class="out">  ·  Security: </span><span class="val">POST-QUANTUM</span><span class="out">  ·  Status: </span><span class="val">OPERATIONAL</span><span class="cursor"></span></div>
</div>
</div>
</foreignObject>
</svg>
